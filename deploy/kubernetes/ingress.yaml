apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prescriptcheck-ingress
  namespace: prescriptcheck
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prescriptcheck.atmedical.at
      secretName: prescriptcheck-tls
  rules:
    - host: prescriptcheck.atmedical.at
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: prescriptcheck-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prescriptcheck-frontend
                port:
                  number: 80
