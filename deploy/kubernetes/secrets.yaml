# deploy/kubernetes/secrets.yaml
# WARNING: Do not commit actual secret values to source control!
# Use kubectl create secret or a secrets manager (HashiCorp Vault, AWS Secrets Manager)
# This file is a TEMPLATE only.
#
# Create secrets with:
#   kubectl create secret generic prescriptcheck-secrets \
#     --from-literal=mongodb-uri="mongodb+srv://..." \
#     --from-literal=jwt-secret="$(openssl rand -base64 64)" \
#     --from-literal=encryption-key="$(openssl rand -base64 32)" \
#     -n prescriptcheck

apiVersion: v1
kind: Secret
metadata:
  name: prescriptcheck-secrets
  namespace: prescriptcheck
type: Opaque
stringData:
  # Replace with actual values – NEVER commit real secrets to git
  mongodb-uri: "REPLACE_WITH_ACTUAL_MONGODB_URI"
  jwt-secret: "REPLACE_WITH_ACTUAL_JWT_SECRET_MIN_32_CHARS"
  encryption-key: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY_32_CHARS"
