apiVersion: v1
kind: ConfigMap
metadata:
  name: prescriptcheck-config
  namespace: prescriptcheck
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  ENABLE_2FA: "true"
  RATE_LIMIT_MAX: "100"
  JWT_EXPIRES_IN: "24h"
  JWT_REFRESH_EXPIRES_IN: "7d"
  BCRYPT_ROUNDS: "12"
  ALLOWED_ORIGINS: "https://prescriptcheck.atmedical.at"
