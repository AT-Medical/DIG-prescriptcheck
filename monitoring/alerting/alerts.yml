# monitoring/alerting/alerts.yml
# Alertmanager configuration for PrescriptCheck

global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@atmedical.at'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'

route:
  receiver: default-receiver
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  group_by: [alertname, environment]

  routes:
    - match:
        severity: critical
      receiver: critical-receiver
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: warning-receiver
      repeat_interval: 4h

receivers:
  - name: default-receiver
    email_configs:
      - to: 'dev@atmedical.at'

  - name: critical-receiver
    email_configs:
      - to: 'ops@atmedical.at'
        subject: '[CRITICAL] PrescriptCheck Alert: {{ .GroupLabels.alertname }}'

  - name: warning-receiver
    email_configs:
      - to: 'dev@atmedical.at'
        subject: '[WARNING] PrescriptCheck Alert: {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname]
