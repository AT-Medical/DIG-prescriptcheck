# monitoring/prometheus/prometheus.yml
# Prometheus configuration for PrescriptCheck

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: prescriptcheck

rule_files:
  - "rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prescriptcheck-backend
    static_configs:
      - targets:
          - backend:3000
    metrics_path: /api/metrics
    scheme: http

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: mongodb-exporter
    static_configs:
      - targets:
          - mongodb-exporter:9216
