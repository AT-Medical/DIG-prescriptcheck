# monitoring/prometheus/rules.yml
# Prometheus alerting rules for PrescriptCheck

groups:
  - name: prescriptcheck-availability
    rules:
      - alert: PrescriptCheckDown
        expr: up{job="prescriptcheck-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PrescriptCheck backend is down"
          description: "Backend has been unreachable for more than 1 minute"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }} per second"

  - name: prescriptcheck-performance
    rules:
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time (p95 > 200ms)"
          description: "95th percentile response time: {{ $value }}s"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="prescriptcheck-backend"} > 500000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage (>500MB)"

  - name: prescriptcheck-security
    rules:
      - alert: HighLoginFailureRate
        expr: rate(auth_login_failed_total[5m]) > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High login failure rate – possible brute force attack"
          description: "{{ $value }} failed logins per second"

      - alert: DatabaseConnectionFailure
        expr: mongodb_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MongoDB connection failure"
