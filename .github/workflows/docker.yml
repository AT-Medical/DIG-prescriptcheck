name: Docker Build & Push

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/prescriptcheck-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/prescriptcheck-backend:latest
