name: Docker Build & Push

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.atmedicalgmbh }}
          password: ${{ secrets.dckr_pat_a3XUhrfP1ACkh17w9xR3FunCNBI }}

      - name: Docker Build & Push
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/prescriptcheck-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/prescriptcheck-backend:latest
