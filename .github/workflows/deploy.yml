name: Deployment auf Produktionsserver

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Deployment via SSH (Backend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.91.99.109.157 }}
          username: ${{ secrets.root }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/PrescriptCheck/backend
            git pull
            npm install
            pm2 restart prescriptcheck-backend || pm2 start index.js --name prescriptcheck-backend

      # Optional: Frontend-Deploy, z. B. mit rsync oder scp
