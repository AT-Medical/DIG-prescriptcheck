name: Deployment auf Produktionsserver

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Deployment via SSH (Backend)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/PrescriptCheck/backend
            git pull
            npm install
            pm2 restart prescriptcheck-backend || pm2 start index.js --name prescriptcheck-backend

      # Optional: Frontend-Deploy, z. B. mit rsync oder scp
