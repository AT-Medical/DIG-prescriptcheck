# .github/workflows/audit.yml

name: Sicherheits-Audit & Abhängigkeitsprüfung

on:
  schedule:
    - cron: '0 2 * * 1'  # Jeden Montag um 2:00 Uhr nachts (UTC)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: |
          cd backend
          npm install

      - name: Sicherheits-Audit (npm audit)
        run: |
          cd backend
          npm audit --production

      - name: Ergebnis als Artefakt bereitstellen
        if: always()
        run: |
          cd backend
          npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Audit-Report hochladen
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: backend/npm-audit-report.json
